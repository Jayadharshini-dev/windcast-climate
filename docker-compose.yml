# WindCast Climate — local database
# Usage:   cp .env.example .env   (once)
#          docker compose up -d
# The SQL files in db/init/ run automatically, in filename order, the FIRST time
# the database volume is created. To rebuild from scratch:
#          docker compose down -v && docker compose up -d

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16   # pinned for reproducibility (rule 9)
    container_name: windcast-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-windcast}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-windcast_dev}
      POSTGRES_DB: ${POSTGRES_DB:-windcast}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-windcast} -d ${POSTGRES_DB:-windcast}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
